syntax = "proto3";
package wallet;
import "google/protobuf/timestamp.proto";

service WalletService {
  rpc GetWalletInfo        (WalletRequest) returns (WalletInfo);
  rpc GetPolymarketProfile (WalletRequest) returns (PolymarketProfile);
  rpc GetFullProfile       (WalletRequest) returns (FullProfile);
}

message WalletRequest {
  string wallet = 1;
}

message WalletInfo {
  string wallet          = 1;
  string polygon_balance = 2;
  int32  tx_count        = 3;
  google.protobuf.Timestamp last_enriched_at = 4;
}

message PolymarketProfile {
  string wallet          = 1;
  string profile_status  = 2;
  string username        = 3;
  string display_name    = 4;
  google.protobuf.Timestamp created_at = 5;
  int32  total_trades      = 6;
  string total_volume      = 7;
  string total_realized_pnl = 8;
  string win_rate          = 9;
  string avg_pnl_per_trade = 10;
  string portfolio_value   = 11;
  google.protobuf.Timestamp last_enriched_at = 12;
}

message FullProfile {
  string wallet          = 1;
  string polygon_balance = 2;
  int32  tx_count        = 3;
  string profile_status  = 4;
  string username        = 5;
  string display_name    = 6;
  google.protobuf.Timestamp created_at = 7;
  int32  total_trades      = 8;
  string total_volume      = 9;
  string total_realized_pnl = 10;
  string win_rate          = 11;
  string avg_pnl_per_trade = 12;
  string portfolio_value   = 13;
  google.protobuf.Timestamp last_enriched_at = 14;
}
