services:
  pm-wallet-info:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm-wallet-info
    ports:
      - "18551:50051"
    environment:
      GRPC_PORT:               ${GRPC_PORT:-50051}
      POLYGONSCAN_API_KEY:     ${POLYGONSCAN_API_KEY}
      POLYMARKET_PROFILE_URL:  ${POLYMARKET_PROFILE_URL:-https://gamma-api.polymarket.com/public-profile}
      POLYMARKET_CLOSED_POS_URL: ${POLYMARKET_CLOSED_POS_URL:-https://data-api.polymarket.com/closed-positions}
      POLYMARKET_VALUE_URL:    ${POLYMARKET_VALUE_URL:-https://data-api.polymarket.com/value}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - pm-project

networks:
  pm-project:
    external: true
    name: pm-project
